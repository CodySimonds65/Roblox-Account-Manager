name: macOS compatibility

on:
  pull_request:
    paths:
      - "src/**"
      - "build/macos/**"
      - "tests/RobloxAccountManager.Core.Tests/**"
      - "tests/RobloxAccountManager.Platform.MacOS.Tests/**"
      - ".github/workflows/macos-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test shared launch and security contracts
        run: dotnet run --project tests/RobloxAccountManager.Core.Tests/RobloxAccountManager.Core.Tests.csproj -c Release
      - name: Test macOS platform safety contracts
        run: dotnet run --project tests/RobloxAccountManager.Platform.MacOS.Tests/RobloxAccountManager.Platform.MacOS.Tests.csproj -c Release
      - name: Build macOS platform adapter
        run: dotnet build src/RobloxAccountManager.Platform.MacOS/RobloxAccountManager.Platform.MacOS.csproj -c Release
      - name: Publish Avalonia desktop
        run: dotnet publish src/RobloxAccountManager.Desktop/RobloxAccountManager.Desktop.csproj -c Release -r "${{ matrix.rid }}" --self-contained true -o "artifacts/${{ matrix.rid }}"
      - name: Package unsigned app bundle
        run: bash build/macos/package-app.sh "artifacts/${{ matrix.rid }}" "artifacts/Roblox Account Manager.app" 0.0.0
      - name: Smoke-test app composition
        run: '"artifacts/Roblox Account Manager.app/Contents/MacOS/RobloxAccountManager" --validate-composition'
      - name: Smoke-test unsigned PKG creation
        run: |
          set -euo pipefail
          app="artifacts/Roblox Account Manager.app"
          pkg="artifacts/RobloxAccountManager-validation-${{ matrix.rid }}-unsigned.pkg"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$app/Contents/Info.plist"
          bash build/macos/package-pkg.sh --unsigned "$app" "$pkg" "${{ matrix.rid }}" 1
      - name: Smoke-test unsigned PKG installation
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/ram-pkg-install.dmg"
          mountpoint="$RUNNER_TEMP/ram-pkg-install-volume"
          pkg="artifacts/RobloxAccountManager-validation-${{ matrix.rid }}-unsigned.pkg"
          mkdir -p "$mountpoint"
          hdiutil create -quiet -size 512m -fs APFS -volname "RAM PKG Smoke" "$image"
          hdiutil attach -quiet -nobrowse -mountpoint "$mountpoint" "$image"
          cleanup() { hdiutil detach -quiet "$mountpoint" || true; }
          trap cleanup EXIT
          sudo -n installer -allowUntrusted -pkg "$pkg" -target "$mountpoint"
          test -d "$mountpoint/Applications/Roblox Account Manager.app"
          test -x "$mountpoint/Applications/Roblox Account Manager.app/Contents/MacOS/RobloxAccountManager"
      - name: Upload macOS validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-validation-${{ matrix.rid }}
          path: |
            artifacts/Roblox Account Manager.app
            artifacts/RobloxAccountManager-validation-${{ matrix.rid }}-unsigned.pkg
          if-no-files-found: error
          retention-days: 14
